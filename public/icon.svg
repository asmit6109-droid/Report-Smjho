<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#042f2e" />
    </linearGradient>
    <linearGradient id="sheetGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0fdfa" />
    </linearGradient>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background with squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer glow ring -->
  <rect x="20" y="20" width="472" height="472" rx="96" fill="none" stroke="#2dd4bf" stroke-width="4" stroke-opacity="0.3" />

  <!-- Medical Document Sheet -->
  <g filter="url(#shadow)">
    <rect x="116" y="96" width="280" height="328" rx="28" fill="url(#sheetGrad)" />
    <!-- Document top fold/accent -->
    <path d="M 336 96 L 396 156 L 336 156 Z" fill="#ccfbf1" />
    <path d="M 336 96 L 396 156" stroke="#99f6e4" stroke-width="2" />
  </g>

  <!-- Medical Cross on Document -->
  <g>
    <!-- Circle badge behind cross -->
    <circle cx="256" cy="226" r="62" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="4" />
    <!-- Vertical bar -->
    <rect x="242" y="184" width="28" height="84" rx="8" fill="url(#crossGrad)" />
    <!-- Horizontal bar -->
    <rect x="214" y="212" width="84" height="28" rx="8" fill="url(#crossGrad)" />
    <!-- Small heart pulse inside cross -->
    <circle cx="256" cy="226" r="6" fill="#ffffff" />
  </g>

  <!-- Traffic Light Dots Indicator (Green, Yellow, Red) representing report reading -->
  <g transform="translate(160, 324)">
    <!-- Line 1: Summary gauge -->
    <rect x="0" y="0" width="192" height="10" rx="5" fill="#e2e8f0" />
    <rect x="0" y="0" width="128" height="10" rx="5" fill="#10b981" />
    
    <!-- 3 Traffic light dots below -->
    <circle cx="36" cy="34" r="14" fill="#10b981" />
    <circle cx="96" cy="34" r="14" fill="#f59e0b" />
    <circle cx="156" cy="34" r="14" fill="#ef4444" />

    <!-- Pulse checkmark inside green dot -->
    <path d="M 30 34 L 34 38 L 43 29" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
